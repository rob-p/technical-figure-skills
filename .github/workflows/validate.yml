name: Validate skill and examples
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: skills/scientific-diagrams/scripts/requirements-lock.txt
      - run: pip install -r requirements-lock.txt
      - run: python -m unittest discover -s tests -v
      - run: python skills/scientific-diagrams/scripts/build_examples.py --out dist/examples
      - run: python skills/scientific-diagrams/scripts/check_exports.py dist/examples
      - run: python tools/package_skill.py
      - uses: actions/upload-artifact@v4
        with:
          name: scientific-diagrams
          path: dist/
